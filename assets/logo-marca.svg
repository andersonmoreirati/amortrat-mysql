<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" role="img" aria-label="AMORTRAT — Tratamento Térmico de Metais">
  <title>AMORTRAT — Tratamento Térmico de Metais</title>
  <defs>
    <!-- Chama vibrante: amarelo brilhante → laranja → vermelho saturado -->
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="25%"  stop-color="#FFB624"/>
      <stop offset="55%"  stop-color="#FF6B14"/>
      <stop offset="80%"  stop-color="#E03A14"/>
      <stop offset="100%" stop-color="#B81E0E"/>
    </linearGradient>
    <!-- Núcleo amarelo brilhante -->
    <linearGradient id="core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#FFF3A0"/>
      <stop offset="50%"  stop-color="#FFD24A"/>
      <stop offset="100%" stop-color="#F49622"/>
    </linearGradient>
    <!-- Tigela: marrom quente -->
    <linearGradient id="bowl" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#8B6F5C"/>
      <stop offset="50%"  stop-color="#5C3F2E"/>
      <stop offset="100%" stop-color="#3D2818"/>
    </linearGradient>
    <!-- Cabo: marrom no topo → cinza na base (transição quente para frio) -->
    <linearGradient id="handle" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#6B5042"/>
      <stop offset="55%"  stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>

  <!-- ============== TOCHA ============== -->
  <g transform="translate(4 2)">

    <!-- ===== CHAMA (a estrela do logo) ===== -->
    <!-- Chama principal: alongada, viva, com perfil dramático -->
    <path d="
      M 28 0
      C 30 6, 34 11, 38 17
      C 42 23, 44 29, 44 35
      C 44 40, 41 43, 42 46
      C 44 49, 40 51, 36 51
      C 33 51, 31 52, 28 52
      C 25 52, 23 51, 20 51
      C 16 51, 12 49, 14 46
      C 15 43, 12 40, 12 35
      C 12 29, 14 23, 18 17
      C 22 11, 26 6, 28 0 Z
    " fill="url(#flame)"/>

    <!-- Sombras laterais para sugerir volume -->
    <path d="M 16 30 Q 11 34, 14 42 Q 17 39, 16 30 Z" fill="#A82612" opacity="0.55"/>
    <path d="M 40 30 Q 45 34, 42 42 Q 39 39, 40 30 Z" fill="#A82612" opacity="0.55"/>

    <!-- Núcleo amarelo: forma interna -->
    <path d="
      M 28 11
      C 30 17, 33 21, 35 27
      C 37 32, 36 37, 35 41
      C 36 44, 32 47, 28 47
      C 24 47, 20 44, 21 41
      C 20 37, 19 32, 21 27
      C 23 21, 26 17, 28 11 Z
    " fill="url(#core)"/>

    <!-- Centro mais quente / brilho -->
    <path d="
      M 28 20
      C 30 24, 31 28, 31 33
      C 31 37, 29 39, 28 39
      C 27 39, 25 37, 25 33
      C 25 28, 26 24, 28 20 Z
    " fill="#FFF3A0" opacity="0.95"/>

    <!-- ===== TIGELA (compacta, não passa da chama) ===== -->
    <!-- Borda superior: largura próxima da chama (não maior) -->
    <ellipse cx="28" cy="52" rx="16" ry="2" fill="#5C3F2E"/>
    <!-- Corpo da copa: trapézio compacto -->
    <path d="
      M 12 53
      L 44 53
      L 40 60
      L 16 60 Z
    " fill="url(#bowl)"/>
    <!-- Borda inferior -->
    <ellipse cx="28" cy="60" rx="12" ry="1.4" fill="#3D2818"/>
    <!-- Ranhuras horizontais sutis -->
    <line x1="14" y1="56" x2="42" y2="56" stroke="#3D2818" stroke-width="0.6" opacity="0.5"/>
    <!-- Reflexo metálico no topo -->
    <ellipse cx="28" cy="51.5" rx="13" ry="0.8" fill="#A88770" opacity="0.55"/>

    <!-- ===== CABO (estreito, discreto) ===== -->
    <!-- Anel/junta -->
    <rect x="22" y="60" width="12" height="2" rx="0.4" fill="url(#handle)"/>
    <!-- Haste: losango compacto e estreito (não passa da chama em largura) -->
    <path d="
      M 22 62
      L 34 62
      L 32 67
      L 28 74
      L 24 67 Z
    " fill="url(#handle)"/>
    <!-- Highlight central sutil -->
    <path d="M 27.6 62 L 28.4 62 L 28 74 Z" fill="#9CA3AF" opacity="0.4"/>

  </g>

  <!-- ============== WORDMARK ============== -->
  <!-- AMORTRAT: dominante, começa em x=80 (gap "parágrafo" da tocha que termina em ~52) -->
  <!-- Texto secundário: text-anchor="start" em x=80, textLength forçado para alinhar ao final do AMORTRAT -->
  <g>
    <text x="66" y="50"
          font-family="Manrope, system-ui, sans-serif"
          font-weight="800"
          font-size="46"
          letter-spacing="0.5"
          fill="#1F2937">AMORTRAT</text>
    <text x="66" y="71"
          font-family="Inter, system-ui, sans-serif"
          font-weight="500"
          font-size="10.5"
          fill="#6B7280"
          textLength="262"
          lengthAdjust="spacing">TRATAMENTO TÉRMICO DE METAIS</text>
  </g>
</svg>
